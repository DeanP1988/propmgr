  <script>
    (function generateAppleTouchPngIcon() {
      try {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        // Base Dark Slate & Obsidian Gradient
        const bgGrad = ctx.createLinearGradient(0, 0, size, size);
        bgGrad.addColorStop(0, '#181C26');
        bgGrad.addColorStop(0.5, '#0B0F17');
        bgGrad.addColorStop(1, '#02050B');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, size, size);

        // Inner Radial Glow
        const radGlow = ctx.createRadialGradient(size / 2, size * 0.42, 30, size / 2, size * 0.45, 260);
        radGlow.addColorStop(0, 'rgba(0, 240, 255, 0.16)');
        radGlow.addColorStop(0.6, 'rgba(10, 132, 255, 0.08)');
        radGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = radGlow;
        ctx.fillRect(0, 0, size, size);

        // Outer Metallic Cyan Bezel
        ctx.lineWidth = 8;
        const bezelGrad = ctx.createLinearGradient(0, 0, size, size);
        bezelGrad.addColorStop(0, '#3A4252');
        bezelGrad.addColorStop(0.5, '#1E2530');
        bezelGrad.addColorStop(1, 'rgba(0, 240, 255, 0.7)');
        ctx.strokeStyle = bezelGrad;
        ctx.strokeRect(4, 4, size - 8, size - 8);

        // Ground Foundation Bar
        ctx.strokeStyle = '#2C3545';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(76, 386);
        ctx.lineTo(436, 386);
        ctx.stroke();

        // Architectural Villa Silhouette
        ctx.beginPath();
        ctx.moveTo(108, 386);
        ctx.lineTo(108, 250);
        ctx.lineTo(256, 134);
        ctx.lineTo(404, 250);
        ctx.lineTo(404, 386);
        ctx.closePath();
        ctx.fillStyle = '#0F1624';
        ctx.fill();
        ctx.strokeStyle = '#1D2A40';
        ctx.lineWidth = 5;
        ctx.stroke();

        // Luminous Dual Roofline (Neon Cyan to Royal Blue)
        ctx.beginPath();
        ctx.moveTo(80, 260);
        ctx.lineTo(256, 124);
        ctx.lineTo(432, 260);
        const roofGrad = ctx.createLinearGradient(80, 260, 432, 260);
        roofGrad.addColorStop(0, '#00F0FF');
        roofGrad.addColorStop(0.5, '#38BDF8');
        roofGrad.addColorStop(1, '#0A84FF');
        ctx.strokeStyle = roofGrad;
        ctx.lineWidth = 22;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = '#00F0FF';
        ctx.shadowBlur = 24;
        ctx.stroke();

        // Reset shadow for inner elements
        ctx.shadowBlur = 0;

        // Modern Villa Windows
        ctx.fillStyle = 'rgba(0, 240, 255, 0.2)';
        ctx.strokeStyle = '#00F0FF';
        ctx.lineWidth = 3;

        // Left Window
        ctx.beginPath();
        ctx.rect(142, 296, 42, 42);
        ctx.fill();
        ctx.stroke();

        // Right Window
        ctx.beginPath();
        ctx.rect(328, 296, 42, 42);
        ctx.fill();
        ctx.stroke();

        // Central Entrance Frame
        ctx.beginPath();
        ctx.moveTo(216, 386);
        ctx.lineTo(216, 290);
        ctx.arcTo(256, 260, 296, 290, 22);
        ctx.lineTo(296, 386);
        ctx.fillStyle = '#060B12';
        ctx.fill();
        ctx.strokeStyle = '#00F0FF';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Glowing Emerald Australian Dollar Badge
        const badgeX = 372;
        const badgeY = 154;
        const badgeR = 64;

        ctx.shadowColor = '#30D158';
        ctx.shadowBlur = 28;
        ctx.beginPath();
        ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
        ctx.fillStyle = '#062816';
        ctx.fill();
        ctx.lineWidth = 7;
        ctx.strokeStyle = '#30D158';
        ctx.stroke();

        // Australian Dollar Sign inside Badge
        ctx.shadowColor = '#30D158';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#30D158';
        ctx.font = '900 70px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('$', badgeX, badgeY + 3);

        // Convert to lossless PNG Data URL
        const pngDataUrl = canvas.toDataURL('image/png');
        window.AU_APP_PNG_ICON = pngDataUrl;

        // Synchronously update iOS Safari touch icon tags
        const appleIcon = document.getElementById('apple-touch-icon-link');
        const appleIconPre = document.getElementById('apple-touch-icon-precomposed-link');
        const favicon = document.getElementById('favicon-link');

        if (appleIcon) appleIcon.href = pngDataUrl;
        if (appleIconPre) appleIconPre.href = pngDataUrl;
        if (favicon) favicon.href = pngDataUrl;
      } catch (err) {
        console.error('Failed to generate PNG touch icon:', err);
      }
    })();
  </script>

    const formatAUD = (amount) => {
      return new Intl.NumberFormat('en-AU', {
        style: 'currency',
        currency: 'AUD',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(amount || 0);
    };

      return new Intl.NumberFormat('en-AU', {

        currency: 'AUD',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(amount || 0);
    };

    const formatDateAU = (dateString) => {
      if (!dateString) return '';
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return dateString;
      const day = String(date.getDate()).padStart(2, '0');
      const month = date.toLocaleString('en-AU', { month: 'short' });
      const year = date.getFullYear();
      return `${day} ${month} ${year}`;
    };

    const getFinancialYear = (dateString) => {
      if (!dateString) return 'FY 2026-27';
      const date = new Date(dateString);
      const month = date.getMonth() + 1;
      const year = date.getFullYear();
      if (month >= 7) {
        const nextYear = String(year + 1).slice(-2);
        return `FY ${year}-${nextYear}`;
      } else {
        const currentYearShort = String(year).slice(-2);
        return `FY ${year - 1}-${currentYearShort}`;
      }
    };

    const calculatePropertyGrowth = (purchasePrice, currentValuation, purchaseDateStr) => {
      if (!purchasePrice || purchasePrice <= 0 || !currentValuation) {
        return { totalPercent: 0, percentPerYear: 0, totalGain: 0 };
      }
      const totalGain = currentValuation - purchasePrice;
      const totalPercent = (totalGain / purchasePrice) * 100;
      const purchaseDate = new Date(purchaseDateStr || '2020-01-01');
      const now = new Date();
      const diffTime = Math.abs(now - purchaseDate);
      const elapsedYears = Math.max(diffTime / (1000 * 60 * 60 * 24 * 365.25), 0.25);
      const percentPerYear = totalPercent / elapsedYears;
      return { totalPercent, percentPerYear, totalGain, elapsedYears };
    };

      // Form States
      const [txForm, setTxForm] = useState({

      // Save to localStorage whenever user modifies properties or transactions
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY_PROPS, JSON.stringify(properties));
        } catch (e) {
          console.warn('Could not save properties to localStorage:', e);
        }
      }, [properties]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY_TXS, JSON.stringify(transactions));
        } catch (e) {
          console.warn('Could not save transactions to localStorage:', e);
        }
      }, [transactions]);

      useEffect(() => {
        if (properties.length > 0 && (!txForm.propertyId || !properties.some(p => p.id === txForm.propertyId))) {
          setTxForm(prev => ({ ...prev, propertyId: properties[0].id }));
        }
      }, [properties]);

      const availableFYs = useMemo(() => {
        const set = new Set([...GENERATED_FY_LIST]);
        transactions.forEach(t => { if (t.financialYear) set.add(t.financialYear); });
        return Array.from(set).sort().reverse();
      }, [transactions]);

      const handleStepFY = (direction) => {
        const cleanList = availableFYs.filter(fy => fy !== 'ALL');
        const currentIndex = cleanList.indexOf(selectedFY);
        if (direction === 'prev' && currentIndex < cleanList.length - 1) {
          setSelectedFY(cleanList[currentIndex + 1]);
        } else if (direction === 'next' && currentIndex > 0) {
          setSelectedFY(cleanList[currentIndex - 1]);
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          setTxForm(prev => ({
            ...prev,
            attachment: { name: file.name, type: file.type, dataUrl: reader.result }
          }));
        };
        reader.readAsDataURL(file);
      };

      const handleSaveTransaction = (e) => {
        e.preventDefault();
        if (!txForm.amount || isNaN(txForm.amount) || !txForm.propertyId) return;
        const computedFY = getFinancialYear(txForm.date);

        if (editingTx) {
          setTransactions(prev => prev.map(t => t.id === editingTx.id ? {
            ...txForm,
            id: editingTx.id,
            amount: parseFloat(txForm.amount),
            financialYear: computedFY
          } : t));
        } else {
          const newTx = {
            ...txForm,
            id: `tx-${Date.now()}`,
            amount: parseFloat(txForm.amount),
            financialYear: computedFY
          };
          setTransactions(prev => [newTx, ...prev]);
        }
        setIsAddTxSheetOpen(false);
        setEditingTx(null);
        setTxForm({
          propertyId: properties[0]?.id || '',
          type: 'expense',
          category: ATO_EXPENSE_CATEGORIES[0],
          amount: '',
          date: new Date().toISOString().split('T')[0],
          vendor: '',
          notes: '',
          isTaxDeductible: true,
          attachment: null
        });
      };

      const handleSaveProperty = (e) => {
        e.preventDefault();
        if (!propForm.address) return;
        const pPrice = parseFloat(propForm.purchasePrice) || 0;
        const cVal = parseFloat(propForm.currentValuation) || pPrice;
        const lBal = parseFloat(propForm.loanBalance) || 0;
        const cRent = parseFloat(propForm.currentRent) || 0;
        const tRent = parseFloat(propForm.targetRent) || cRent;

        const newProp = {
          id: `prop-${Date.now()}`,
          address: propForm.address,
          shortName: propForm.shortName || propForm.address.split(',')[0],
          propertyType: propForm.propertyType,
          purchasePrice: pPrice,
          currentValuation: cVal,
          loanBalance: lBal,
          purchaseDate: propForm.purchaseDate,
          ownershipShare: parseFloat(propForm.ownershipShare) || 100,
          currentRent: cRent,
          targetRent: tRent,
          isStrata: propForm.isStrata,
          interestRate: parseFloat(propForm.interestRate) || 0,
          monthlyRepayment: parseFloat(propForm.monthlyRepayment) || 0
        };

        setProperties(prev => [...prev, newProp]);
        setIsAddPropSheetOpen(false);
        setPropForm({
          address: '',
          shortName: '',
          propertyType: 'Unit / Apartment',
          purchasePrice: '',
          currentValuation: '',
          loanBalance: '',
          purchaseDate: new Date().toISOString().split('T')[0],
          ownershipShare: 100,
          currentRent: '',
          targetRent: '',
          isStrata: true,
          interestRate: '',
          monthlyRepayment: ''
        });
      };

      const metrics = useMemo(() => {
        const activeTxs = transactions.filter(t => {
          const matchesFY = selectedFY === 'ALL' || t.financialYear === selectedFY;
          const matchesProperty = selectedPropertyId === 'ALL' || t.propertyId === selectedPropertyId;
          return matchesFY && matchesProperty;
        });

        let totalIncome = 0;
        let totalExpenses = 0;
        let taxDeductibleExpenses = 0;

        activeTxs.forEach(t => {
          if (t.type === 'income') totalIncome += t.amount;
          else {
            totalExpenses += t.amount;
            if (t.isTaxDeductible) taxDeductibleExpenses += t.amount;
          }
        });

        const netCashFlow = totalIncome - totalExpenses;
        const filteredProps = selectedPropertyId === 'ALL' ? properties : properties.filter(p => p.id === selectedPropertyId);
        const totalValuation = filteredProps.reduce((sum, p) => sum + (p.currentValuation || p.purchasePrice || 0), 0);
        const totalLoans = filteredProps.reduce((sum, p) => sum + (p.loanBalance || 0), 0);
        const totalEquity = Math.max(totalValuation - totalLoans, 0);
        const totalLVR = totalValuation > 0 ? (totalLoans / totalValuation) * 100 : 0;

        return {
          totalIncome,
          totalExpenses,
          netCashFlow,
          taxDeductibleExpenses,
          totalValuation,
          totalLoans,
          totalEquity,
          totalLVR
        };
      }, [transactions, properties, selectedFY, selectedPropertyId]);

      // Property LVR chart breakdown
      const propertyLvrData = useMemo(() => {
        const filteredProps = selectedPropertyId === 'ALL' ? properties : properties.filter(p => p.id === selectedPropertyId);
        return filteredProps.map(p => {
          const val = p.currentValuation || p.purchasePrice || 0;
          const loan = p.loanBalance || 0;
          const equity = Math.max(val - loan, 0);
          const lvr = val > 0 ? ((loan / val) * 100).toFixed(1) : 0;
          return {
            name: p.shortName || p.address.split(',')[0],
            Equity: equity,
            Loan: loan,
            Valuation: val,
            LVR: lvr
          };
        });
      }, [properties, selectedPropertyId]);

      // Matrix computation
      const matrixData = useMemo(() => {
        const incomeMap = {};
        const expenseMap = {};
        const attachmentMap = {};
        ATO_INCOME_CATEGORIES.forEach(cat => { incomeMap[cat] = new Array(12).fill(0); });
        ATO_EXPENSE_CATEGORIES.forEach(cat => { expenseMap[cat] = new Array(12).fill(0); });
        const monthlyTotalIncome = new Array(12).fill(0);
        const monthlyTotalExpenses = new Array(12).fill(0);

        const activeTxs = transactions.filter(t => {
          const matchesFY = selectedFY === 'ALL' || t.financialYear === selectedFY;
          const matchesProperty = selectedPropertyId === 'ALL' || t.propertyId === selectedPropertyId;
          return matchesFY && matchesProperty;
        });

        activeTxs.forEach(t => {
          if (!t.date) return;
          const date = new Date(t.date);
          const mIdx = date.getMonth();
          const fyColIdx = (mIdx >= 6) ? mIdx - 6 : mIdx + 6;

          if (t.type === 'income') {
            if (!incomeMap[t.category]) incomeMap[t.category] = new Array(12).fill(0);
            incomeMap[t.category][fyColIdx] += t.amount;
            monthlyTotalIncome[fyColIdx] += t.amount;
          } else {
            if (!expenseMap[t.category]) expenseMap[t.category] = new Array(12).fill(0);
            expenseMap[t.category][fyColIdx] += t.amount;
            monthlyTotalExpenses[fyColIdx] += t.amount;
          }

          if (t.attachment) {
            attachmentMap[`${t.category}_${fyColIdx}`] = t.attachment;
          }
        });

        const monthlyNetCashflow = monthlyTotalIncome.map((inc, i) => inc - monthlyTotalExpenses[i]);
        return { incomeMap, expenseMap, attachmentMap, monthlyTotalIncome, monthlyTotalExpenses, monthlyNetCashflow };
      }, [transactions, selectedFY, selectedPropertyId]);

      // Monthly cashflow data for chart
      const monthlyData = useMemo(() => {
        const months = ['Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
        return months.map((m, idx) => ({
          month: m,
          Income: matrixData.monthlyTotalIncome[idx],
          Expense: matrixData.monthlyTotalExpenses[idx]
        }));
      }, [matrixData]);

      // Filtered transactions for Activity tab
      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchesFY = selectedFY === 'ALL' || t.financialYear === selectedFY;
          const matchesProperty = selectedPropertyId === 'ALL' || t.propertyId === selectedPropertyId;
          const matchesType = txTypeSegment === 'ALL' || t.type === txTypeSegment;
          const matchesSearch = txSearch === '' || 
            (t.vendor && t.vendor.toLowerCase().includes(txSearch.toLowerCase())) ||
            (t.notes && t.notes.toLowerCase().includes(txSearch.toLowerCase())) ||
            t.category.toLowerCase().includes(txSearch.toLowerCase());
          return matchesFY && matchesProperty && matchesType && matchesSearch;
        });
      }, [transactions, selectedFY, selectedPropertyId, txTypeSegment, txSearch]);

      const expensePieData = useMemo(() => {
        const map = {};
        const activeTxs = transactions.filter(t => {
          const matchesFY = selectedFY === 'ALL' || t.financialYear === selectedFY;
          const matchesProperty = selectedPropertyId === 'ALL' || t.propertyId === selectedPropertyId;
          return matchesFY && matchesProperty && t.type === 'expense';
        });

        activeTxs.forEach(t => {
          map[t.category] = (map[t.category] || 0) + t.amount;
        });

        return Object.keys(map).map(cat => ({
          name: cat,
          value: map[cat]
        })).sort((a, b) => b.value - a.value);
      }, [transactions, selectedFY, selectedPropertyId]);

      return (
        <div className="min-h-screen bg-black text-zinc-100 flex flex-col pb-28 select-none">
          
          {/* iOS TOP HEADER */}
          <header className="sticky top-0 z-30 bg-[#1C1C1E]/85 backdrop-blur-xl border-b border-zinc-800/80 pt-3 pb-2.5 px-4 shadow-sm">
            <div className="max-w-md mx-auto flex items-center justify-between gap-2">
              {/* FAR LEFT: CUSTOM ARCHITECTURAL APP ICON BADGE */}
              <div className="flex items-center space-x-2.5 min-w-0">
                <img 
                  src={window.AU_APP_PNG_ICON || APP_HERO_ICON_SVG} 
                  alt="AU Property Icon" 
                  className="w-9 h-9 rounded-2xl shadow-lg shadow-cyan-950/60 border border-cyan-500/30 shrink-0 object-cover" 
                />
                <div className="min-w-0">
                  <h1 className="text-sm font-bold leading-tight text-white truncate">
                    Property Tracker
                  </h1>
                  <p className="text-[10px] text-zinc-400 font-medium truncate">ATO Compliant • AU Financials</p>
                </div>
              </div>

              {/* RIGHT SIDE: '+' BUTTON & TIGHTENED FY SELECTOR */}
              <div className="flex items-center space-x-1.5 shrink-0">
                <button
                  onClick={() => {
                    if (properties.length === 0) {
                      setIsAddPropSheetOpen(true);
                    } else {
                      setEditingTx(null);
                      setIsAddTxSheetOpen(true);
                    }
                  }}
                  title={properties.length === 0 ? "Add First Property" : "Log New Activity"}
                  className="w-6 h-6 rounded-full bg-blue-600 hover:bg-blue-500 active:scale-95 text-white flex items-center justify-center shadow-sm border border-blue-400/40 transition-all shrink-0"
                >
                  <PlusIcon className="w-3.5 h-3.5" />
                </button>

                <div className="flex items-center bg-[#2C2C2E] rounded-full px-1 py-0.5 border border-zinc-700/60 shadow-inner">
                  <button
                    onClick={() => handleStepFY('prev')}
                    className="w-5 h-5 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition-colors text-xs font-bold shrink-0"
                  >
                    ‹
                  </button>
                  <div className="relative flex items-center px-0.5">
                    <CalendarIcon className="w-2.5 h-2.5 mr-0.5 text-blue-400 pointer-events-none shrink-0" />
                    <select 
                      value={selectedFY} 
                      onChange={(e) => setSelectedFY(e.target.value)}
                      className="bg-transparent text-[10px] font-bold text-blue-400 appearance-none focus:outline-none pr-2.5 cursor-pointer py-0.5 max-w-[82px] truncate"
                    >
                      {availableFYs.map(fy => (
                        <option key={fy} value={fy} className="bg-[#1C1C1E] text-white">{fy}</option>
                      ))}
                      <option value="ALL" className="bg-[#1C1C1E] text-white">All FY Years</option>
                    </select>
                    <ChevronDownIcon className="w-2 h-2 text-blue-400 pointer-events-none -ml-2 shrink-0" />
                  </div>
                  <button
                    onClick={() => handleStepFY('next')}
                    className="w-5 h-5 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition-colors text-xs font-bold shrink-0"
                  >
                    ›
                  </button>
                </div>
              </div>
            </div>

            {/* PROPERTY FILTER */}
            <div className="max-w-md mx-auto mt-2.5 overflow-x-auto no-scrollbar pb-0.5">
              <div className="flex items-center space-x-2 min-w-max">
                <button
                  onClick={() => setSelectedPropertyId('ALL')}
                  className={`px-3 py-1 rounded-full text-xs font-semibold transition-all ${
                    selectedPropertyId === 'ALL'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'bg-[#2C2C2E] text-zinc-400 hover:text-zinc-200 border border-zinc-800'
                  }`}
                >
                  All Portfolio
                </button>
                {properties.map(p => (
                  <button
                    key={p.id}
                    onClick={() => setSelectedPropertyId(p.id)}
                    className={`px-3 py-1 rounded-full text-xs font-semibold transition-all ${
                      selectedPropertyId === p.id
                        ? 'bg-blue-600 text-white shadow-sm'
                        : 'bg-[#2C2C2E] text-zinc-400 hover:text-zinc-200 border border-zinc-800'
                    }`}
                  >
                    {p.shortName || p.address.split(',')[0]}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-md w-full mx-auto px-4 pt-4 space-y-4">

            {/* EMPTY STATE BANNER WHEN NO PROPERTIES ARE PRESENT */}
            {properties.length === 0 && (
              <div className="bg-[#1C1C1E] rounded-3xl p-6 border border-zinc-800/80 shadow-xl text-center space-y-3">
                <div className="w-12 h-12 rounded-2xl bg-blue-950/80 text-blue-400 border border-blue-800/50 flex items-center justify-center mx-auto">
                  <HomeIcon className="w-6 h-6" />
                </div>
                <div className="space-y-1">
                  <h3 className="text-base font-bold text-white">No Properties Added Yet</h3>
                  <p className="text-xs text-zinc-400 max-w-xs mx-auto">
                    Add your first Australian residential investment property to begin tracking cashflow, LVR, and tax deductions.
                  </p>
                </div>
                <button
                  onClick={() => setIsAddPropSheetOpen(true)}
                  className="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold px-4 py-2.5 rounded-2xl text-xs flex items-center gap-1.5 mx-auto transition-all shadow-md"
                >
                  <PlusIcon className="w-4 h-4" /> Add First Property
                </button>
              </div>
            )}

            {/* TAB 1: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                {/* Net Operating Cashflow Card */}
                <div className="bg-[#1C1C1E] rounded-3xl p-5 border border-zinc-800 shadow-lg space-y-4">
                  <div className="flex items-center justify-between text-[11px] font-semibold text-zinc-400 uppercase tracking-wider">
                    <span>Net Operating Cashflow ({selectedFY})</span>
                    <span className="text-blue-400 font-bold">{selectedPropertyId === 'ALL' ? 'Total Portfolio' : 'Single Asset'}</span>
                  </div>

                  <div className="flex items-baseline justify-between">
                    <div>
                      <div className={`text-3xl font-black tracking-tight ${metrics.netCashFlow >= 0 ? 'text-white' : 'text-rose-400'}`}>
                        {formatAUDExact(metrics.netCashFlow)}
                      </div>
                      <div className="text-xs text-zinc-400 font-medium mt-0.5">Operating Position</div>
                    </div>

                    <div className={`px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 ${
                      metrics.netCashFlow >= 0 ? 'bg-emerald-950/80 text-emerald-400 border border-emerald-800/50' : 'bg-rose-950/80 text-rose-400 border border-rose-800/50'
                    }`}>
                      {metrics.netCashFlow >= 0 ? <TrendingUpIcon className="w-3.5 h-3.5" /> : <TrendingDownIcon className="w-3.5 h-3.5" />}
                      {metrics.netCashFlow >= 0 ? 'Positively Geared' : 'Negatively Geared'}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2.5 pt-3 border-t border-zinc-800">
                    <div className="bg-[#2C2C2E]/70 p-3 rounded-2xl border border-zinc-800">
                      <div className="text-[11px] font-medium text-zinc-400 flex items-center gap-1">
                        <ArrowDownRightIcon className="w-3.5 h-3.5 text-emerald-400" /> Rental Income
                      </div>
                      <div className="text-base font-bold text-white mt-1">{formatAUD(metrics.totalIncome)}</div>
                    </div>
                    <div className="bg-[#2C2C2E]/70 p-3 rounded-2xl border border-zinc-800">
                      <div className="text-[11px] font-medium text-zinc-400 flex items-center gap-1">
                        <ArrowUpRightIcon className="w-3.5 h-3.5 text-rose-400" /> Total Expenses
                      </div>
                      <div className="text-base font-bold text-white mt-1">{formatAUD(metrics.totalExpenses)}</div>
                    </div>
                  </div>

                  <div className="bg-emerald-950/30 border border-emerald-800/60 rounded-2xl p-3 flex items-center justify-between text-xs">
                    <div className="flex items-center gap-2">
                      <CheckCircle2Icon className="w-4 h-4 text-emerald-400 shrink-0" />
                      <span className="font-semibold text-emerald-300">ATO Deductible Expenses</span>
                    </div>
                    <span className="font-extrabold text-emerald-400">{formatAUD(metrics.taxDeductibleExpenses)}</span>
                  </div>
                </div>

                {/* LVR & Equity Breakdown Card */}
                <div className="bg-[#1C1C1E] rounded-3xl p-5 border border-zinc-800 shadow-lg space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-sm font-bold text-white flex items-center gap-2">
                        <LandmarkIcon className="w-4 h-4 text-cyan-400" /> Portfolio Equity & LVR
                      </h3>
                      <p className="text-[11px] text-zinc-400">Asset values vs Mortgages</p>
                    </div>
                    <div className="bg-purple-950/80 border border-purple-800/60 text-purple-300 text-xs font-black px-2.5 py-1 rounded-full">
                      LVR: {metrics.totalLVR.toFixed(1)}%
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    <div className="bg-[#2C2C2E]/80 p-3 rounded-2xl border border-zinc-800">
                      <span className="text-[10px] font-semibold text-cyan-400 uppercase tracking-wider block">Net Portfolio Equity</span>
                      <span className="text-base font-black text-white mt-0.5 block">{formatAUD(metrics.totalEquity)}</span>
                    </div>
                    <div className="bg-[#2C2C2E]/80 p-3 rounded-2xl border border-zinc-800">
                      <span className="text-[10px] font-semibold text-purple-400 uppercase tracking-wider block">Total Debt (Loans)</span>
                      <span className="text-base font-black text-white mt-0.5 block">{formatAUD(metrics.totalLoans)}</span>
                    </div>
                  </div>

                  {ResponsiveContainer && propertyLvrData.length > 0 ? (
                    <div className="h-44 w-full pt-1">
                      <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={propertyLvrData} margin={{ top: 10, right: 0, left: -25, bottom: 0 }}>
                          <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#2C2C2E" />
                          <XAxis dataKey="name" tickLine={false} axisLine={false} tick={{ fontSize: 10, fill: '#8E8E93' }} />
                          <YAxis tickLine={false} axisLine={false} tick={{ fontSize: 10, fill: '#8E8E93' }} tickFormatter={(val) => `$${val/1000}k`} />
                          <Tooltip 
                            formatter={(val, name) => [formatAUD(val), name]}
                            contentStyle={{ backgroundColor: '#2C2C2E', borderRadius: '12px', border: '1px solid #3A3A3C', color: '#FFF', fontSize: '11px' }}
                          />
                          <Bar dataKey="Equity" stackId="a" fill="#22D3EE" barSize={20} />
                          <Bar dataKey="Loan" stackId="a" fill="#A855F7" radius={[4, 4, 0, 0]} barSize={20} />
                        </BarChart>
                      </ResponsiveContainer>
                    </div>
                  ) : (
                    <p className="text-center text-xs text-zinc-500 py-4">No property valuation data to plot.</p>
                  )}
                </div>

                {/* Monthly Income vs Expense Chart (Interchangeable Column / Line) */}
                <div className="bg-[#1C1C1E] rounded-3xl p-5 border border-zinc-800 shadow-lg space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-sm font-bold text-white">Monthly Cashflow</h3>
                      <p className="text-[11px] text-zinc-400">AU Financial Year ({selectedFY})</p>
                    </div>

                    <div className="bg-[#2C2C2E] p-0.5 rounded-xl flex items-center border border-zinc-700">
                      <button
                        onClick={() => setCashflowChartType('column')}
                        className={`px-2 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 transition-all ${
                          cashflowChartType === 'column' ? 'bg-blue-600 text-white shadow-sm' : 'text-zinc-400'
                        }`}
                      >
                        <BarChart2Icon className="w-3 h-3" /> Column
                      </button>
                      <button
                        onClick={() => setCashflowChartType('line')}
                        className={`px-2 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 transition-all ${
                          cashflowChartType === 'line' ? 'bg-blue-600 text-white shadow-sm' : 'text-zinc-400'
                        }`}
                      >
                        <LineChartIcon className="w-3 h-3" /> Line
                      </button>
                    </div>
                  </div>

                  {ResponsiveContainer && (
                    <div className="h-44 w-full pt-1">
                      <ResponsiveContainer width="100%" height="100%">
                        {cashflowChartType === 'column' ? (
                          <BarChart data={monthlyData} margin={{ top: 0, right: 0, left: -25, bottom: 0 }}>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#2C2C2E" />
                            <XAxis dataKey="month" tickLine={false} axisLine={false} tick={{ fontSize: 10, fill: '#8E8E93' }} />
                            <YAxis tickLine={false} axisLine={false} tick={{ fontSize: 10, fill: '#8E8E93' }} tickFormatter={(val) => `$${val}`} />
                            <Tooltip 
                              formatter={(val) => formatAUD(val)}
                              contentStyle={{ backgroundColor: '#2C2C2E', borderRadius: '12px', border: '1px solid #3A3A3C', color: '#FFF', fontSize: '11px' }}
                            />
                            <Bar dataKey="Income" fill="#30D158" radius={[3, 3, 0, 0]} barSize={10} />
                            <Bar dataKey="Expense" fill="#FF453A" radius={[3, 3, 0, 0]} barSize={10} />
                          </BarChart>
                        ) : (
                          <LineChart data={monthlyData} margin={{ top: 5, right: 10, left: -25, bottom: 0 }}>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#2C2C2E" />
                            <XAxis dataKey="month" tickLine={false} axisLine={false} tick={{ fontSize: 10, fill: '#8E8E93' }} />
                            <YAxis tickLine={false} axisLine={false} tick={{ fontSize: 10, fill: '#8E8E93' }} tickFormatter={(val) => `$${val}`} />
                            <Tooltip 
                              formatter={(val) => formatAUD(val)}
                              contentStyle={{ backgroundColor: '#2C2C2E', borderRadius: '12px', border: '1px solid #3A3A3C', color: '#FFF', fontSize: '11px' }}
                            />
                            <Line type="monotone" dataKey="Income" stroke="#30D158" strokeWidth={2.5} dot={{ r: 3 }} />
                            <Line type="monotone" dataKey="Expense" stroke="#FF453A" strokeWidth={2.5} dot={{ r: 3 }} />
                          </LineChart>
                        )}
                      </ResponsiveContainer>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 2: PROPERTIES */}
            {activeTab === 'properties' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between px-1">
                  <div>
                    <h2 className="text-lg font-extrabold text-white">Investment Properties</h2>
                    <p className="text-xs text-zinc-400">{properties.length} Active Asset Holdings</p>
                  </div>
                  <button
                    onClick={() => setIsAddPropSheetOpen(true)}
                    className="bg-blue-600 active:bg-blue-700 text-white px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm"
                  >
                    <PlusIcon className="w-3.5 h-3.5" /> Add Property
                  </button>
                </div>

                <div className="space-y-3">
                  {properties.length === 0 ? (
                    <div className="bg-[#1C1C1E] rounded-3xl p-8 text-center text-zinc-500 space-y-3 border border-zinc-800">
                      <HomeIcon className="w-8 h-8 mx-auto stroke-1 opacity-50" />
                      <p className="text-xs text-zinc-400">No properties configured yet.</p>
                      <button
                        onClick={() => setIsAddPropSheetOpen(true)}
                        className="bg-blue-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs"
                      >
                        + Add Your First Property
                      </button>
                    </div>
                  ) : (
                    properties.map(p => {
                      const growth = calculatePropertyGrowth(p.purchasePrice, p.currentValuation, p.purchaseDate);
                      const rentProgress = p.targetRent > 0 ? Math.min((p.currentRent / p.targetRent) * 100, 100) : 100;
                      const propVal = p.currentValuation || p.purchasePrice || 0;
                      const propLoan = p.loanBalance || 0;
                      const propEquity = Math.max(propVal - propLoan, 0);
                      const propLVR = propVal > 0 ? ((propLoan / propVal) * 100).toFixed(1) : 0;

                      return (
                        <div key={p.id} className="bg-[#1C1C1E] rounded-3xl p-5 border border-zinc-800 shadow-lg space-y-4">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-3">
                              <div className="w-10 h-10 rounded-2xl bg-blue-950/80 text-blue-400 border border-blue-800/50 flex items-center justify-center shrink-0">
                                <HomeIcon className="w-5 h-5" />
                              </div>
                              <div>
                                <h3 className="text-sm font-bold text-white leading-tight">{p.address}</h3>
                                <p className="text-[10px] text-zinc-400 font-medium mt-0.5">
                                  {p.propertyType} • Purchased {formatDateAU(p.purchaseDate)}
                                </p>
                              </div>
                            </div>
                            <button
                              onClick={() => {
                                setProperties(prev => prev.filter(item => item.id !== p.id));
                                setTransactions(prev => prev.filter(t => t.propertyId !== p.id));
                              }}
                              className="p-1.5 text-zinc-500 hover:text-rose-400"
                              title="Delete Property"
                            >
                              <Trash2Icon className="w-4 h-4" />
                            </button>
                          </div>

                          {/* Valuation & Capital Growth Metrics */}
                          <div className="bg-[#2C2C2E]/80 rounded-2xl p-3 border border-zinc-800 space-y-2.5">
                            <div className="grid grid-cols-3 gap-1.5 text-xs text-center">
                              <div className="bg-[#1C1C1E] p-2 rounded-xl border border-zinc-800">
                                <span className="text-[9px] font-semibold text-zinc-400 block uppercase">Purchase</span>
                                <span className="font-extrabold text-white text-xs">{formatAUD(p.purchasePrice)}</span>
                              </div>
                              <div className="bg-[#1C1C1E] p-2 rounded-xl border border-zinc-800">
                                <span className="text-[9px] font-semibold text-zinc-400 block uppercase">Valuation</span>
                                <span className="font-extrabold text-white text-xs">{formatAUD(p.currentValuation)}</span>
                              </div>
                              <div className="bg-[#1C1C1E] p-2 rounded-xl border border-zinc-800">
                                <span className="text-[9px] font-semibold text-purple-400 block uppercase">Mortgage</span>
                                <span className="font-extrabold text-purple-300 text-xs">{formatAUD(p.loanBalance)}</span>
                              </div>
                            </div>

                            <div className="grid grid-cols-2 gap-2 text-xs">
                              <div className="bg-[#1C1C1E] p-2.5 rounded-xl border border-zinc-800 flex items-center gap-2">
                                <div className="p-1 rounded-lg bg-emerald-950 text-emerald-400 shrink-0">
                                  <TrendingUpIcon className="w-3.5 h-3.5" />
                                </div>
                                <div>
                                  <div className="text-[9px] text-zinc-400 font-medium">Gain / Year</div>
                                  <div className="font-extrabold text-emerald-400 text-xs">
                                    +{growth.percentPerYear.toFixed(1)}% <span className="text-[9px] text-zinc-400">/ yr</span>
                                  </div>
                                </div>
                              </div>

                              <div className="bg-[#1C1C1E] p-2.5 rounded-xl border border-zinc-800 flex items-center gap-2">
                                <div className="p-1 rounded-lg bg-cyan-950 text-cyan-400 shrink-0">
                                  <LandmarkIcon className="w-3.5 h-3.5" />
                                </div>
                                <div>
                                  <div className="text-[9px] text-zinc-400 font-medium">Net Equity (LVR)</div>
                                  <div className="font-extrabold text-cyan-400 text-xs">
                                    {formatAUD(propEquity)} <span className="text-[9px] text-purple-300">({propLVR}%)</span>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>

                          {/* Current Rent directly ABOVE Rent Target */}
                          <div className="bg-[#2C2C2E]/80 rounded-2xl p-3 border border-zinc-800 space-y-2">
                            <div className="grid grid-cols-2 gap-2 pt-1">
                              <div className="bg-[#1C1C1E] p-2.5 rounded-xl border border-zinc-800/80">
                                <div className="text-[10px] font-semibold text-emerald-400 uppercase tracking-wider flex items-center justify-between">
                                  <span>Current Rent</span>
                                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                </div>
                                <div className="text-base font-black text-white mt-0.5">${p.currentRent} <span className="text-[10px] text-zinc-400 font-normal">/ wk</span></div>
                              </div>

                              <div className="bg-[#1C1C1E] p-2.5 rounded-xl border border-zinc-800/80">
                                <div className="text-[10px] font-semibold text-amber-400 uppercase tracking-wider flex items-center justify-between">
                                  <span>Rent Target</span>
                                  <TargetIcon className="w-3 h-3 text-amber-400" />
                                </div>
                                <div className="text-base font-black text-white mt-0.5">${p.targetRent} <span className="text-[10px] text-zinc-400 font-normal">/ wk</span></div>
                              </div>
                            </div>

                            <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden mt-1">
                              <div 
                                className="bg-gradient-to-r from-emerald-500 to-blue-500 h-full transition-all duration-500"
                                style={{ width: `${rentProgress}%` }}
                              />
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* TAB 3: MATRIX CALENDAR */}
            {activeTab === 'matrix' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between px-1">
                  <div>
                    <h2 className="text-lg font-extrabold text-white flex items-center gap-2">
                      <GridIcon className="w-5 h-5 text-blue-400" /> Matrix Calendar
                    </h2>
                    <p className="text-xs text-zinc-400">Monthly breakdown for {selectedFY}</p>
                  </div>
                  <div className="text-[10px] text-zinc-400 bg-[#1C1C1E] px-2.5 py-1 rounded-full border border-zinc-800 font-semibold">
                    👈 Scroll table
                  </div>
                </div>

                <div className="bg-[#1C1C1E] rounded-3xl border border-zinc-800 shadow-xl overflow-hidden">
                  <div className="overflow-x-auto scrollbar-thin scrollbar-thumb-zinc-700">
                    <table className="w-full text-left border-collapse text-xs min-w-[850px]">
                      <thead>
                        <tr className="bg-[#2C2C2E] border-b border-zinc-800 text-zinc-300 font-bold">
                          <th className="p-3 sticky left-0 bg-[#2C2C2E] z-20 min-w-[180px] border-r border-zinc-800">
                            Category / ATO Item
                          </th>
                          {AU_FY_MONTHS.map(m => (
                            <th key={m.name} className="p-2.5 text-center min-w-[65px]">{m.name}</th>
                          ))}
                          <th className="p-3 text-right bg-[#3A3A3C] text-blue-400 font-black min-w-[95px]">
                            Full {selectedFY.split(' ')[1] || 'FY'}
                          </th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-800/80">
                        {/* Income Header */}
                        <tr className="bg-emerald-950/40 text-emerald-400 font-bold text-[11px] uppercase tracking-wider">
                          <td colSpan={14} className="p-2 pl-3">1. Income Categories</td>
                        </tr>
                        {ATO_INCOME_CATEGORIES.map(category => {
                          const monthlyVals = matrixData.incomeMap[category] || new Array(12).fill(0);
                          const rowTotal = monthlyVals.reduce((a, b) => a + b, 0);
                          return (
                            <tr key={category} className="hover:bg-zinc-800/40">
                              <td className="p-2.5 sticky left-0 bg-[#1C1C1E] z-10 border-r border-zinc-800 font-medium text-zinc-200 text-[11px] truncate max-w-[180px]">
                                {category}
                              </td>
                              {monthlyVals.map((val, idx) => (
                                <td key={idx} className="p-2 text-center text-zinc-300 text-[11px]">
                                  {val > 0 ? `$${val.toLocaleString('en-AU', { maximumFractionDigits: 0 })}` : '-'}
                                </td>
                              ))}
                              <td className="p-2.5 text-right font-bold text-emerald-400 bg-zinc-900/60 text-[11px]">
                                {rowTotal > 0 ? formatAUD(rowTotal) : '-'}
                              </td>
                            </tr>
                          );
                        })}

                        {/* Income Totals */}
                        <tr className="bg-emerald-950/70 text-emerald-300 font-extrabold border-t-2 border-emerald-800/60 text-[11px]">
                          <td className="p-2.5 sticky left-0 bg-[#0F291E] z-10 border-r border-zinc-800">TOTAL INCOME</td>
                          {matrixData.monthlyTotalIncome.map((tot, idx) => (
                            <td key={idx} className="p-2 text-center">{tot > 0 ? `$${tot.toLocaleString('en-AU', { maximumFractionDigits: 0 })}` : '$0'}</td>
                          ))}
                          <td className="p-2.5 text-right text-emerald-400 bg-emerald-900/80 font-black text-xs">
                            {formatAUD(matrixData.monthlyTotalIncome.reduce((a, b) => a + b, 0))}
                          </td>
                        </tr>

                        {/* Expense Header */}
                        <tr className="bg-rose-950/40 text-rose-400 font-bold text-[11px] uppercase tracking-wider">
                          <td colSpan={14} className="p-2 pl-3">2. ATO Expenses (Schedule Item 21)</td>
                        </tr>
                        {ATO_EXPENSE_CATEGORIES.map(category => {
                          const monthlyVals = matrixData.expenseMap[category] || new Array(12).fill(0);
                          const rowTotal = monthlyVals.reduce((a, b) => a + b, 0);
                          return (
                            <tr key={category} className="hover:bg-zinc-800/40">
                              <td className="p-2.5 sticky left-0 bg-[#1C1C1E] z-10 border-r border-zinc-800 font-medium text-zinc-300 text-[11px] truncate max-w-[180px]">
                                {category}
                              </td>
                              {monthlyVals.map((val, idx) => (
                                <td key={idx} className="p-2 text-center text-zinc-300 text-[11px]">
                                  {val > 0 ? `$${val.toLocaleString('en-AU', { maximumFractionDigits: 0 })}` : '-'}
                                </td>
                              ))}
                              <td className="p-2.5 text-right font-bold text-rose-400 bg-zinc-900/60 text-[11px]">
                                {rowTotal > 0 ? formatAUD(rowTotal) : '-'}
                              </td>
                            </tr>
                          );
                        })}

                        {/* Expense Totals */}
                        <tr className="bg-rose-950/70 text-rose-300 font-extrabold border-t-2 border-rose-800/60 text-[11px]">
                          <td className="p-2.5 sticky left-0 bg-[#2D1217] z-10 border-r border-zinc-800">TOTAL EXPENSES</td>
                          {matrixData.monthlyTotalExpenses.map((tot, idx) => (
                            <td key={idx} className="p-2 text-center">{tot > 0 ? `$${tot.toLocaleString('en-AU', { maximumFractionDigits: 0 })}` : '$0'}</td>
                          ))}
                          <td className="p-2.5 text-right text-rose-400 bg-rose-900/80 font-black text-xs">
                            {formatAUD(matrixData.monthlyTotalExpenses.reduce((a, b) => a + b, 0))}
                          </td>
                        </tr>

                        {/* Net Cashflow Row */}
                        <tr className="bg-[#2C2C2E] text-white font-black text-xs border-t-2 border-blue-500">
                          <td className="p-3 sticky left-0 bg-[#2C2C2E] z-10 border-r border-zinc-800 text-blue-400">NET CASHFLOW</td>
                          {matrixData.monthlyNetCashflow.map((net, idx) => (
                            <td key={idx} className={`p-2 text-center ${net >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                              {net !== 0 ? `${net < 0 ? '-' : ''}$${Math.abs(net).toLocaleString('en-AU', { maximumFractionDigits: 0 })}` : '$0'}
                            </td>
                          ))}
                          <td className={`p-3 text-right font-black text-xs bg-[#3A3A3C] ${metrics.netCashFlow >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                            {formatAUD(metrics.netCashFlow)}
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: ACTIVITY LOG */}
            {activeTab === 'transactions' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between px-1">
                  <div>
                    <h2 className="text-lg font-extrabold text-white">Transactions Log</h2>
                    <p className="text-xs text-zinc-400">{filteredTransactions.length} items logged for {selectedFY}</p>
                  </div>
                  <button
                    onClick={() => {
                      if (properties.length === 0) {
                        setIsAddPropSheetOpen(true);
                      } else {
                        setEditingTx(null);
                        setIsAddTxSheetOpen(true);
                      }
                    }}
                    className="bg-blue-600 active:bg-blue-700 text-white px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm"
                  >
                    <PlusIcon className="w-3.5 h-3.5" /> Log Entry
                  </button>
                </div>

                <div className="relative">
                  <SearchIcon className="w-4 h-4 absolute left-3 top-2.5 text-zinc-400" />
                  <input
                    type="text"
                    placeholder="Search category, payee, notes..."
                    value={txSearch}
                    onChange={(e) => setTxSearch(e.target.value)}
                    className="w-full bg-[#1C1C1E] focus:bg-[#2C2C2E] text-white text-xs pl-9 pr-3 py-2.5 rounded-xl border border-zinc-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>

                <div className="space-y-2">
                  {filteredTransactions.length === 0 ? (
                    <div className="bg-[#1C1C1E] rounded-3xl p-8 text-center text-zinc-500 space-y-2 border border-zinc-800">
                      <ReceiptIcon className="w-8 h-8 mx-auto stroke-1 opacity-50" />
                      <p className="text-xs">No transactions recorded for {selectedFY}.</p>
                      <button
                        onClick={() => {
                          if (properties.length === 0) setIsAddPropSheetOpen(true);
                          else setIsAddTxSheetOpen(true);
                        }}
                        className="bg-blue-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs"
                      >
                        + Log Income or Expense
                      </button>
                    </div>
                  ) : (
                    filteredTransactions.map(tx => {
                      const prop = properties.find(p => p.id === tx.propertyId);
                      return (
                        <div key={tx.id} className="bg-[#1C1C1E] rounded-2xl p-3.5 border border-zinc-800 flex items-center justify-between">
                          <div className="flex items-center gap-3">
                            <div className={`w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 ${
                              tx.type === 'income' ? 'bg-emerald-950/80 text-emerald-400 border border-emerald-800/50' : 'bg-[#2C2C2E] text-zinc-300'
                            }`}>
                              {tx.type === 'income' ? <ArrowDownRightIcon className="w-5 h-5" /> : <ArrowUpRightIcon className="w-5 h-5" />}
                            </div>
                            <div>
                              <div className="text-xs font-bold text-white line-clamp-1">{tx.category}</div>
                              <div className="text-[10px] text-zinc-400 font-medium">
                                {prop?.shortName || prop?.address.split(',')[0]} • {formatDateAU(tx.date)}
                              </div>
                              {tx.vendor && <div className="text-[10px] text-zinc-400 font-medium">{tx.vendor}</div>}
                            </div>
                          </div>

                          <div className="text-right space-y-1">
                            <div className={`text-xs font-black ${tx.type === 'income' ? 'text-emerald-400' : 'text-white'}`}>
                              {tx.type === 'income' ? '+' : '-'}{formatAUDExact(tx.amount)}
                            </div>
                            <div className="flex items-center justify-end gap-1.5">
                              {tx.attachment && (
                                <button
                                  onClick={() => setPreviewAttachment(tx.attachment)}
                                  className="bg-blue-950/90 text-blue-400 text-[10px] font-bold px-1.5 py-0.5 rounded-md border border-blue-800/60 flex items-center gap-1"
                                >
                                  <PaperclipIcon className="w-3 h-3" /> Receipt
                                </button>
                              )}
                              <button onClick={() => setTransactions(prev => prev.filter(t => t.id !== tx.id))} className="p-1 text-zinc-500 hover:text-rose-400">
                                <Trash2Icon className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* TAB 5: ATO TAX SCHEDULE */}
            {activeTab === 'tax' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-br from-zinc-900 to-[#1C1C1E] text-white p-5 rounded-3xl border border-zinc-800 shadow-xl space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] uppercase font-bold tracking-widest text-emerald-400 bg-emerald-950/80 border border-emerald-500/30 px-2 py-0.5 rounded-full">
                      ATO Schedule Item 21
                    </span>
                    <span className="text-xs text-zinc-300 font-semibold">{selectedFY}</span>
                  </div>
                  <div>
                    <h2 className="text-lg font-black text-white">Rental Tax Summary</h2>
                    <p className="text-xs text-zinc-400 mt-1">Formatted for standard Australian Tax Office return.</p>
                  </div>
                  <button 
                    onClick={() => window.print()}
                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5"
                  >
                    <PrinterIcon className="w-3.5 h-3.5" /> Export Schedule (Print / PDF)
                  </button>
                </div>

                <div className="bg-[#1C1C1E] rounded-3xl p-5 border border-zinc-800 space-y-3">
                  <h3 className="text-xs font-bold text-emerald-400 uppercase tracking-wider bg-emerald-950/60 border border-emerald-800/40 p-2 rounded-xl">
                    1. Gross Rental Income
                  </h3>
                  <div className="divide-y divide-zinc-800 text-xs">
                    {ATO_INCOME_CATEGORIES.map(category => {
                      const total = transactions
                        .filter(t => (selectedFY === 'ALL' || t.financialYear === selectedFY) &&
                                     (selectedPropertyId === 'ALL' || t.propertyId === selectedPropertyId) &&
                                     t.type === 'income' && t.category === category)
                        .reduce((sum, t) => sum + t.amount, 0);
                      return (
                        <div key={category} className="py-2.5 flex justify-between items-center text-zinc-400">
                          <span>{category}</span>
                          <span className="font-bold text-white">{formatAUDExact(total)}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="bg-[#1C1C1E] rounded-3xl p-5 border border-zinc-800 space-y-3">
                  <h3 className="text-xs font-bold text-rose-400 uppercase tracking-wider bg-rose-950/60 border border-rose-800/40 p-2 rounded-xl">
                    2. Deductible Expenses
                  </h3>
                  <div className="divide-y divide-zinc-800 text-xs">
                    {ATO_EXPENSE_CATEGORIES.map(category => {
                      const total = transactions
                        .filter(t => (selectedFY === 'ALL' || t.financialYear === selectedFY) &&
                                     (selectedPropertyId === 'ALL' || t.propertyId === selectedPropertyId) &&
                                     t.type === 'expense' && t.isTaxDeductible && t.category === category)
                        .reduce((sum, t) => sum + t.amount, 0);
                      return (
                        <div key={category} className="py-2.5 flex justify-between items-center text-zinc-400">
                          <span>{category}</span>
                          <span className="font-bold text-white">{formatAUDExact(total)}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 6: CHARTS */}
            {activeTab === 'analytics' && (
              <div className="space-y-4">
                <div className="bg-[#1C1C1E] rounded-3xl p-5 border border-zinc-800 space-y-3">
                  <h3 className="text-sm font-bold text-white">Expense Distribution</h3>
                  <p className="text-xs text-zinc-400">Portfolio outgoings breakdown for {selectedFY}</p>
                  {ResponsiveContainer && expensePieData.length > 0 ? (
                    <div className="h-48 w-full">
                      <ResponsiveContainer width="100%" height="100%">
                        <PieChart>
                          <Pie
                            data={expensePieData}
                            dataKey="value"
                            nameKey="name"
                            cx="50%"
                            cy="50%"
                            innerRadius={45}
                            outerRadius={75}
                            paddingAngle={3}
                          >
                            {expensePieData.map((entry, index) => (
                              <Cell key={`cell-${index}`} fill={DARK_CHART_COLORS[index % DARK_CHART_COLORS.length]} />
                            ))}
                          </Pie>
                          <Tooltip formatter={(val) => formatAUD(val)} />
                        </PieChart>
                      </ResponsiveContainer>
                    </div>
                  ) : (
                    <p className="text-center text-xs text-zinc-500 py-6">No expenses logged for this period.</p>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* BOTTOM TAB BAR */}
          <nav className="fixed bottom-0 left-0 right-0 z-30 bg-[#1C1C1E]/90 backdrop-blur-xl border-t border-zinc-800/80 px-1 py-2 pb-6">
            <div className="max-w-md mx-auto grid grid-cols-6 gap-0.5 text-center">
              <button
                onClick={() => setActiveTab('dashboard')}
                className={`flex flex-col items-center py-1 transition-all ${
                  activeTab === 'dashboard' ? 'text-blue-400 font-bold' : 'text-zinc-500 font-medium'
                }`}
              >
                <BarChart2Icon className="w-5 h-5" />
                <span className="text-[9px] mt-0.5">Overview</span>
              </button>
              <button
                onClick={() => setActiveTab('properties')}
                className={`flex flex-col items-center py-1 transition-all ${
                  activeTab === 'properties' ? 'text-blue-400 font-bold' : 'text-zinc-500 font-medium'
                }`}
              >
                <HomeIcon className="w-5 h-5" />
                <span className="text-[9px] mt-0.5">Assets</span>
              </button>
              <button
                onClick={() => setActiveTab('matrix')}
                className={`flex flex-col items-center py-1 transition-all ${
                  activeTab === 'matrix' ? 'text-blue-400 font-bold' : 'text-zinc-500 font-medium'
                }`}
              >
                <GridIcon className="w-5 h-5" />
                <span className="text-[9px] mt-0.5">Matrix</span>
              </button>
              <button
                onClick={() => setActiveTab('transactions')}
                className={`flex flex-col items-center py-1 transition-all ${
                  activeTab === 'transactions' ? 'text-blue-400 font-bold' : 'text-zinc-500 font-medium'
                }`}
              >
                <ReceiptIcon className="w-5 h-5" />
                <span className="text-[9px] mt-0.5">Activity</span>
              </button>
              <button
                onClick={() => setActiveTab('tax')}
                className={`flex flex-col items-center py-1 transition-all ${
                  activeTab === 'tax' ? 'text-blue-400 font-bold' : 'text-zinc-500 font-medium'
                }`}
              >
                <FileTextIcon className="w-5 h-5" />
                <span className="text-[9px] mt-0.5">ATO Tax</span>
              </button>
              <button
                onClick={() => setActiveTab('analytics')}
                className={`flex flex-col items-center py-1 transition-all ${
                  activeTab === 'analytics' ? 'text-blue-400 font-bold' : 'text-zinc-500 font-medium'
                }`}
              >
                <PieChartIcon className="w-5 h-5" />
                <span className="text-[9px] mt-0.5">Charts</span>
              </button>
            </div>
          </nav>

          {/* ADD ACTIVITY MODAL */}
          {isAddTxSheetOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-end justify-center">
              <div className="bg-[#1C1C1E] border-t border-zinc-800 w-full max-w-md rounded-t-[32px] p-5 shadow-2xl space-y-4 max-h-[88vh] overflow-y-auto">
                <div className="w-10 h-1 bg-zinc-700 rounded-full mx-auto" />
                <div className="flex items-center justify-between pb-2 border-b border-zinc-800">
                  <h3 className="font-black text-base text-white">Log New Activity</h3>
                  <button onClick={() => setIsAddTxSheetOpen(false)} className="w-7 h-7 bg-zinc-800 text-zinc-300 rounded-full flex items-center justify-center text-xs">✕</button>
                </div>
                <form onSubmit={handleSaveTransaction} className="space-y-3.5">
                  <div className="bg-[#2C2C2E] p-1 rounded-2xl grid grid-cols-2 text-center text-xs font-bold">
                    <button
                      type="button"
                      onClick={() => setTxForm(p => ({ ...p, type: 'expense', category: ATO_EXPENSE_CATEGORIES[0] }))}
                      className={`py-2 rounded-xl transition-all ${txForm.type === 'expense' ? 'bg-rose-600 text-white' : 'text-zinc-400'}`}
                    >
                      Expense
                    </button>
                    <button
                      type="button"
                      onClick={() => setTxForm(p => ({ ...p, type: 'income', category: ATO_INCOME_CATEGORIES[0] }))}
                      className={`py-2 rounded-xl transition-all ${txForm.type === 'income' ? 'bg-emerald-600 text-white' : 'text-zinc-400'}`}
                    >
                      Income
                    </button>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Select Property</label>
                    <select
                      value={txForm.propertyId}
                      onChange={(e) => setTxForm({ ...txForm, propertyId: e.target.value })}
                      className="w-full text-xs font-semibold bg-[#2C2C2E] text-white border border-zinc-700 rounded-xl px-3 py-2.5"
                    >
                      {properties.map(p => (<option key={p.id} value={p.id}>{p.address}</option>))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1">ATO Category</label>
                    <select
                      value={txForm.category}
                      onChange={(e) => setTxForm({ ...txForm, category: e.target.value })}
                      className="w-full text-xs font-semibold bg-[#2C2C2E] text-white border border-zinc-700 rounded-xl px-3 py-2.5"
                    >
                      {txForm.type === 'income' 
                        ? ATO_INCOME_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)
                        : ATO_EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Amount ($ AUD)</label>
                      <input
                        type="number"
                        step="0.01"
                        placeholder="0.00"
                        value={txForm.amount}
                        onChange={(e) => setTxForm({ ...txForm, amount: e.target.value })}
                        required
                        className="w-full text-xs font-bold bg-[#2C2C2E] text-white border border-zinc-700 rounded-xl px-3 py-2.5"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Date</label>
                      <input
                        type="date"
                        value={txForm.date}
                        onChange={(e) => setTxForm({ ...txForm, date: e.target.value })}
                        required
                        className="w-full text-xs font-semibold bg-[#2C2C2E] text-white border border-zinc-700 rounded-xl px-3 py-2.5"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Payee / Vendor</label>
                    <input
                      type="text"
                      placeholder="e.g. City Council, Agent, Tradesperson"
                      value={txForm.vendor}
                      onChange={(e) => setTxForm({ ...txForm, vendor: e.target.value })}
                      className="w-full text-xs bg-[#2C2C2E] text-white border border-zinc-700 rounded-xl px-3 py-2.5 placeholder:text-zinc-500"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Notes</label>
                    <input
                      type="text"
                      placeholder="e.g. Strata quarterly levy"
                      value={txForm.notes}
                      onChange={(e) => setTxForm({ ...txForm, notes: e.target.value })}
                      className="w-full text-xs bg-[#2C2C2E] text-white border border-zinc-700 rounded-xl px-3 py-2.5 placeholder:text-zinc-500"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Receipt Attachment</label>
                    <input
                      type="file"
                      accept="image/*,application/pdf"
                      onChange={handleFileUpload}
                      className="w-full text-xs text-zinc-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white"
                    />
                  </div>
                  <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold py-3 rounded-2xl text-xs">
                    Save Transaction
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* QUICK LOOK MODAL */}
          {previewAttachment && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#1C1C1E] border border-zinc-800 w-full max-w-sm rounded-3xl p-4 shadow-2xl space-y-3">
                <div className="flex items-center justify-between pb-2 border-b border-zinc-800">
                  <span className="font-bold text-xs text-white truncate">{previewAttachment.name}</span>
                  <button onClick={() => setPreviewAttachment(null)} className="text-zinc-400 hover:text-white text-xs">✕</button>
                </div>
                <div className="rounded-2xl overflow-hidden border border-zinc-800 bg-black min-h-[250px] flex items-center justify-center p-2">
                  <img src={previewAttachment.dataUrl} alt="Receipt" className="max-h-[380px] w-auto object-contain rounded-lg" />
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
